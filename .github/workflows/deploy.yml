name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/portfolio-personal
            git fetch origin master
            git pull --ff-only origin master
            docker compose up -d --build portfolio
            docker compose ps portfolio

      - name: Verify site is reachable
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null "https://jasperrobinson.nl"; then
              echo "Site is up."
              exit 0
            fi
            echo "Waiting for site to respond (attempt ${i}/5)..."
            sleep 10
          done
          echo "Site health check failed."
          exit 1
