name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate required deploy secrets
        id: validate-secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          [ -n "${VPS_HOST:-}" ] || { echo "::error::Missing required secret: VPS_HOST"; exit 1; }
          [ -n "${VPS_USER:-}" ] || { echo "::error::Missing required secret: VPS_USER"; exit 1; }
          [ -n "${VPS_PASSWORD:-}" ] || { echo "::error::Missing required secret: VPS_PASSWORD"; exit 1; }

          if [ -z "${VPS_PORT:-}" ]; then
            echo "vps_port=22" >> "$GITHUB_OUTPUT"
          else
            echo "vps_port=${VPS_PORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ steps.validate-secrets.outputs.vps_port }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            APP_DIR="/opt/portfolio-personal"
            SERVICE_NAME="portfolio"
            PREV_COMMIT=""
            DEPLOY_STARTED=0

            rollback() {
              if [ "$DEPLOY_STARTED" -ne 1 ] || [ -z "$PREV_COMMIT" ]; then
                echo "Rollback skipped: deploy did not reach a reversible state."
                return
              fi

              echo "Deploy failed. Rolling back to commit: $PREV_COMMIT"
              cd "$APP_DIR"
              git reset --hard "$PREV_COMMIT"
              docker compose up -d --build "$SERVICE_NAME"
              echo "Rollback completed."
            }

            trap 'rollback' ERR

            cd "$APP_DIR"

            PREV_COMMIT="$(git rev-parse HEAD)"
            DEPLOY_STARTED=1
            echo "Previous commit: $PREV_COMMIT"

            git fetch origin master
            git reset --hard origin/master

            docker compose up -d --build "$SERVICE_NAME"
            docker compose ps "$SERVICE_NAME"

            trap - ERR

            echo "Waiting for site to become reachable..."
            for attempt in 1 2 3 4 5 6; do
              if curl -skI https://jasperrobinson.nl | head -n 1 | grep -qE 'HTTP/2 200|HTTP/1.1 200'; then
                echo "Site is up."
                echo "Portfolio deploy completed successfully."
                exit 0
              fi
              echo "Attempt ${attempt} failed, retrying in 5s..."
              sleep 5
            done

            echo "Site health check failed after deploy."
            exit 1
